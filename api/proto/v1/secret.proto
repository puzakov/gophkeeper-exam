syntax = "proto3";

package gophkeeper.v1;

option go_package = "github.com/puzakov/gophkeeper-exam/internal/proto/v1;protov1";

// SecretType enumerates the kinds of secrets the system can store.
enum SecretType {
  SECRET_TYPE_UNSPECIFIED = 0;
  SECRET_TYPE_LOGIN_PASSWORD = 1;
  SECRET_TYPE_TEXT = 2;
  SECRET_TYPE_BINARY = 3;
  SECRET_TYPE_BANK_CARD = 4;
}

// Secret is the full representation including encrypted payloads.
message Secret {
  string id = 1;
  SecretType type = 2;
  bytes  encrypted_data = 3;     // AES-256-GCM: nonce || ciphertext || tag
  bytes  encrypted_metadata = 4; // same envelope; arbitrary key/value pairs
  string comment = 5;            // plaintext label for listing (non-sensitive)
  int64  version = 6;
  int64  created_at = 7;         // unix seconds
  int64  updated_at = 8;         // unix seconds
}

// SecretSummary contains metadata only — used by ListSecrets to avoid
// downloading encrypted blobs for every item.
message SecretSummary {
  string id = 1;
  SecretType type = 2;
  string comment = 3;
  int64  version = 4;
  int64  updated_at = 5;
}

// SecretService provides CRUD operations for encrypted secrets.
service SecretService {
  rpc CreateSecret(CreateSecretRequest) returns (CreateSecretResponse);
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse);
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  rpc UpdateSecret(UpdateSecretRequest) returns (UpdateSecretResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
}

message CreateSecretRequest {
  SecretType type = 1;
  bytes encrypted_data = 2;
  bytes encrypted_metadata = 3;
  string comment = 4;
}

message CreateSecretResponse {
  string id = 1;
  int64  version = 2;
}

message GetSecretRequest {
  string id = 1;
}

message GetSecretResponse {
  Secret secret = 1;
}

message ListSecretsRequest {}

message ListSecretsResponse {
  repeated SecretSummary secrets = 1;
}

message UpdateSecretRequest {
  string id = 1;
  int64  expected_version = 2;   // optimistic concurrency
  bytes  encrypted_data = 3;
  bytes  encrypted_metadata = 4;
  string comment = 5;
}

message UpdateSecretResponse {
  int64 version = 1;
}

message DeleteSecretRequest {
  string id = 1;
}

message DeleteSecretResponse {}
